<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Eco Participants – SuperCycle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f6f9;
        color: #1a1a1a;
      }

      .header {
        background: linear-gradient(135deg, #1a7f4f, #2ba572);
        color: white;
        padding: 18px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }

      .container {
        max-width: 1300px;
        margin: auto;
        padding: 32px 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }

      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid #e6ebf0;
        font-size: 13px;
      }

      th {
        background: #f0f3f6;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
      }

      .eco-btn {
        background: #2ba572;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 999;
      }

      .modal-content {
        background: white;
        padding: 24px;
        border-radius: 12px;
        width: 400px;
        text-align: center;
      }

      .btn-confirm {
        background: #2ba572;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-cancel {
        background: #ddd;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
      }

      :root { --bg:#f3f7f2; --sidebar:#0f2516; --sidebar-text:#d6e5d5; --sidebar-muted:#88a18e; --border:#dce9de; --gray-100:#f3f7f2; --gray-200:#dce9de; --gray-700:#5b7160; --gray-900:#162418; --shadow:0 20px 45px rgba(24,49,31,.08); --shadow-soft:0 10px 25px rgba(24,49,31,.06); }
      body { min-height:100vh; background:radial-gradient(circle at top right,rgba(46,160,91,.12),transparent 24%),radial-gradient(circle at bottom left,rgba(15,155,168,.08),transparent 26%),linear-gradient(180deg,#f8fbf8 0%,var(--bg) 100%); }
      .app-shell { display:flex; min-height:100vh; }
      .sidebar { width:264px; flex-shrink:0; background:linear-gradient(180deg,rgba(46,160,91,.08),transparent 12%),linear-gradient(180deg,var(--sidebar) 0%,#102819 100%); color:var(--sidebar-text); padding:22px 16px 18px; position:sticky; top:0; height:100vh; overflow-y:auto; }
      .brand { display:flex; align-items:center; gap:14px; padding:10px 10px 18px; }
      .brand-mark { width:46px; height:46px; border-radius:15px; background:linear-gradient(135deg,#33a65f,#17653c); display:grid; place-items:center; color:#fff; font-size:22px; font-weight:900; }
      .brand h1 { font-size:26px; line-height:1; font-weight:900; letter-spacing:-.03em; }
      .brand p { margin-top:4px; color:var(--sidebar-muted); font-size:12px; }
      .nav-group { margin-top:18px; }
      .nav-group-label { color:#6d8472; font-size:11px; font-weight:800; margin:0 12px 10px; }
      .nav-list { display:grid; gap:6px; }
      .nav-item { border:0; background:transparent; color:inherit; width:100%; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; cursor:pointer; text-align:right; }
      .nav-item:hover { background:rgba(255,255,255,.06); }
      .nav-item.active { background:linear-gradient(135deg,rgba(46,160,91,.28),rgba(33,115,70,.56)); color:#fff; }
      .nav-icon { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.06); color:#fff; font-size:13px; font-weight:800; flex-shrink:0; }
      .nav-copy { flex:1; }
      .nav-copy strong { display:block; font-size:13px; }
      .nav-copy span { display:block; margin-top:2px; color:var(--sidebar-muted); font-size:11px; }
      .nav-item.active .nav-copy span { color:rgba(255,255,255,.8); }
      .sidebar-footer { margin-top:18px; padding:14px; border-radius:18px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); display:flex; align-items:center; gap:12px; }
      .sidebar-avatar { width:42px; height:42px; border-radius:14px; background:linear-gradient(135deg,#2ea05b,#1c6b42); display:grid; place-items:center; color:#fff; font-size:16px; font-weight:900; }
      .main-content { flex:1; min-width:0; padding:22px; }
      .header { background:rgba(255,255,255,.78); color:var(--gray-900); padding:20px 22px; border:1px solid rgba(220,233,222,.9); box-shadow:var(--shadow-soft); border-radius:26px; backdrop-filter:blur(12px); }
      .back-btn { background:var(--gray-100); color:var(--gray-700); border:1px solid var(--gray-200); padding:10px 16px; border-radius:12px; }
      .container { max-width:none; margin:0; padding:22px 0 8px; }
      table { border-radius:24px; box-shadow:var(--shadow); }
      .modal-content { border-radius:24px; box-shadow:var(--shadow); }
      @media (max-width:760px) { .app-shell { display:block; } .sidebar { width:100%; height:auto; position:relative; } .main-content { padding:14px; } .header { flex-direction:column; align-items:stretch; gap:12px; } .container { padding:18px 0 28px; } th,td { padding:12px 10px; font-size:13px; } .back-btn,.eco-btn,.btn-cancel,.btn-confirm { width:100%; } .modal-content { width:min(92vw, 400px); } }
    </style>
  </head>

  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SC</div><div><h1>SuperCycle</h1><p>لوحة تحكم المسؤول</p></div></div>
        <div class="nav-group"><div class="nav-list"><button class="nav-item" type="button" onclick="go('dashboard.html')"><span class="nav-icon">DB</span><span class="nav-copy"><strong>الرئيسية</strong><span>ملخص الأداء اليومي</span></span></button></div></div>
        <div class="nav-group"><div class="nav-group-label">العمليات</div><div class="nav-list"><button class="nav-item" type="button" onclick="go('shipments.html?type=approval')"><span class="nav-icon">AP</span><span class="nav-copy"><strong>الموافقات</strong><span>شحنات تحتاج مراجعة</span></span></button><button class="nav-item" type="button" onclick="go('shipments.html?type=segmentation')"><span class="nav-icon">SG</span><span class="nav-copy"><strong>التوجيه والتقسيم</strong><span>جاهزة للتشغيل</span></span></button><button class="nav-item" type="button" onclick="go('vehicles-management.html')"><span class="nav-icon">VH</span><span class="nav-copy"><strong>العربيات</strong><span>إدارة الأسطول</span></span></button><button class="nav-item" type="button" onclick="go('factories-management.html')"><span class="nav-icon">FC</span><span class="nav-copy"><strong>المصانع</strong><span>التغطية والاستقبال</span></span></button></div></div>
        <div class="nav-group"><div class="nav-group-label">الإدارة</div><div class="nav-list"><button class="nav-item" type="button" onclick="go('finance-management.html')"><span class="nav-icon">FN</span><span class="nav-copy"><strong>المالية</strong><span>تسويات وتحويلات</span></span></button><button class="nav-item" type="button" onclick="go('dosh-management.html')"><span class="nav-icon">DS</span><span class="nav-copy"><strong>أنواع وأسعار الدشت</strong><span>التسعير والفئات</span></span></button><button class="nav-item" type="button" onclick="go('contact-management.html')"><span class="nav-icon">CX</span><span class="nav-copy"><strong>الرسائل الواردة</strong><span>متابعة العملاء</span></span></button><button class="nav-item" type="button" onclick="go('contracts-create.html')"><span class="nav-icon">CT</span><span class="nav-copy"><strong>العقود</strong><span>إنشاء متعاقدين جدد</span></span></button></div></div>
        <div class="nav-group"><div class="nav-group-label">المنظومة البيئية</div><div class="nav-list"><button class="nav-item active" type="button"><span class="nav-icon">EP</span><span class="nav-copy"><strong>المشاركون البيئيون</strong><span>إدارة الانضمام</span></span></button><button class="nav-item" type="button" onclick="go('eco-redeems.html')"><span class="nav-icon">RD</span><span class="nav-copy"><strong>طلبات الاستبدال</strong><span>مراجعة وتنفيذ</span></span></button></div></div>
        <div class="sidebar-footer"><div class="sidebar-avatar">AD</div><div><strong>مسؤول النظام</strong><span>Admin Control</span></div></div>
      </aside>
      <main class="main-content">
    <div class="header">
      <h1>🌱 Eco Participants</h1>
      <button class="back-btn" onclick="goBack()">← Dashboard</button>
    </div>

    <div class="container">
      <table>
        <thead>
          <tr>
            <th>Business</th>
            <th>Manager</th>
            <th>Phone</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
      </main>
    </div>

    <div class="modal" id="confirmModal">
      <div class="modal-content">
        <h3>Convert to Eco Participant?</h3>
        <p id="modalText"></p>
        <br />
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmEco()">Confirm</button>
      </div>
    </div>

    <script>
      const API_BASE =
        "https://supercycle-api-855015056699.europe-west1.run.app";
      const token = localStorage.getItem("token");
      if (!token) location.href = "index.html";

      let data = [];
      let selectedUserId = null;

      function go(path) {
        location.href = path;
      }

      function goBack() {
        location.href = "dashboard.html";
      }

      async function loadData() {
        const res = await fetch(
          `${API_BASE}/admin/traders/not-eco-participants`,
          {
            headers: {
              Authorization: "Bearer " + token,
            },
          },
        );

        const json = await res.json();
        data = json.data?.data || [];
        render();
      }

      function render() {
        const rows = document.getElementById("rows");
        rows.innerHTML = "";

        data.forEach((d) => {
          rows.innerHTML += `
        <tr>
          <td><b>${d.bussinessName || "-"}</b></td>
          <td>${d.doshMangerName || "-"}</td>
          <td>${d.doshMangerPhone || "-"}</td>
          <td>
            <button class="eco-btn"
              onclick="openModal('${d.userId}', '${d.bussinessName || ""}')">
              ${__t("Convert")}
            </button>
          </td>
        </tr>
      `;
        });
      }

      function openModal(userId, name) {
        selectedUserId = userId;
        document.getElementById("modalText").innerText =
          `${__t("Convert")} "${name}" ${__t("to Eco participant?")}`;
        document.getElementById("confirmModal").style.display = "flex";
      }

      function closeModal() {
        selectedUserId = null;
        document.getElementById("confirmModal").style.display = "none";
      }

      // ✅ FIXED FUNCTION (BODY + CONTENT-TYPE)
      async function confirmEco() {
        if (!selectedUserId) return;

        const res = await fetch(
          `${API_BASE}/admin/eco/participants/${selectedUserId}`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token,
            },
            body: JSON.stringify({
              isEcoParticipant: true,
              ecoNotes: "تم إضافته للنظام البيئي بواسطة الأدمن",
            }),
          },
        );

        if (!res.ok) {
          const err = await res.json();
          alert(err.message || __t("Failed to convert trader"));
          return;
        }

        closeModal();
        loadData();
      }

      loadData();
      window.onLanguageChange = () => render();
    </script>
    <script src="./site-i18n.js"></script>
  </body>
</html>
